<?xml version="1.0" encoding="UTF-8"?>
<svg width="600" height="400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="600" height="400" fill="white"/>
  
  <!-- Title -->
  <text x="300" y="30" text-anchor="middle" font-family="Arial" font-size="16" font-weight="black">Strap Layout Diagram - LRA and IMU Placement</text>
  
  <!-- Strap outline -->
  <path d="M50,100 Q100,150 150,100 T250,100 T350,100 T450,100 T550,100" 
        stroke="black" stroke-width="2" fill="none"/>
  
  <!-- Strap center line -->
  <path d="M50,100 Q100,150 150,100 T250,100 T350,100 T450,100 T550,100" 
        stroke="gray" stroke-width="1" stroke-dasharray="5,5" fill="none"/>
  
  <!-- IMU placement (center) -->
  <circle cx="300" cy="100" r="15" fill="lightblue" stroke="blue" stroke-width="2"/>
  <text x="300" y="105" text-anchor="middle" font-family="Arial" font-size="10" fill="black">IMU</text>
  <text x="300" y="120" text-anchor="middle" font-family="Arial" font-size="8" fill="black">Dorsal Hand</text>
  <text x="300" y="130" text-anchor="middle" font-family="Arial" font-size="8" fill="black">Center (3rd Meta)</text>
  
  <!-- LRA placements -->
  <!-- LRA 0 - hypothenar (left/proximal) -->
  <rect x="100" y="70" width="20" height="20" fill="lightgreen" stroke="green" stroke-width="2"/>
  <text x="110" y="85" text-anchor="middle" font-family="Arial" font-size="8" fill="black">LRA 0</text>
  <text x="110" y="98" text-anchor="middle" font-family="Arial" font-size="7" fill="black">Hypothenar</text>
  <text x="110" y="110" text-anchor="middle" font-family="Arial" font-size="7" fill="black">(Pinky Side)</text>
  
  <!-- LRA 1 - thenar (center/distal) -->
  <rect x="400" y="70" width="20" height="20" fill="lightgreen" stroke="green" stroke-width="2"/>
  <text x="410" y="85" text-anchor="middle" font-family="Arial" font-size="8" fill="black">LRA 1</text>
  <text x="410" y="98" text-anchor="middle" font-family="Arial" font-size="7" fill="black">Thenar</text>
  <text x="410" y="110" text-anchor="middle" font-family="Arial" font-size="7" fill="black">(Thumb Base)</text>
  
  <!-- LRA 2 - dorsal (right) -->
  <rect x="500" y="70" width="20" height="20" fill="lightgreen" stroke="green" stroke-width="2"/>
  <text x="510" y="85" text-anchor="middle" font-family="Arial" font-size="8" fill="black">LRA 2</text>
  <text x="510" y="98" text-anchor="middle" font-family="Arial" font-size="7" fill="black">Dorsal</text>
  <text x="510" y="110" text-anchor="middle" font-family="Arial" font-size="7" fill="black">(Back of Hand)</text>
  
  <!-- Dimension lines -->
  <line x1="50" y1="150" x2="150" y2="150" stroke="black" stroke-width="1"/>
  <line x1="50" y1="160" x2="50" y2="140" stroke="black" stroke-width="1"/>
  <line x1="150" y1="160" x2="150" y2="140" stroke="black" stroke-width="1"/>
  <text x="100" y="170" text-anchor="middle" font-family="Arial" font-size="10">50mm</text>
  
  <line x1="150" y1="150" x2="250" y2="150" stroke="black" stroke-width="1"/>
  <line x1="150" y1="160" x2="150" y2="140" stroke="black" stroke-width="1"/>
  <line x1="250" y1="160" x2="250" y2="140" stroke="black" stroke-width="1"/>
  <text x="200" y="170" text-anchor="middle" font-family="Arial" font-size="10">50mm</text>
  
  <!-- Legend -->
  <rect x="400" y="200" width="180" height="150" fill="whitesmoke" stroke="black" stroke-width="1"/>
  <text x="490" y="220" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">Legend</text>
  <line x1="410" y1="240" x2="430" y2="240" stroke="lightblue" stroke-width="3"/>
  <text x="440" y="245" font-family="Arial" font-size="10">IMU Sensor</text>
  <rect x="410" y="250" width="20" height="20" fill="lightgreen" stroke="green" stroke-width="2"/>
  <text x="440" y="265" font-family="Arial" font-size="10">LRA Actuator</text>
  <text x="410" y="285" font-family="Arial" font-size="10" font-weight="bold">Strap Dimensions:</text>
  <text x="420" y="300" font-family="Arial" font-size="10">Width: 20mm</text>
  <text x="420" y="315" font-family="Arial" font-size="10">Length: 250mm</text>
  <text x="410" y="335" font-family="Arial" font-size="10" font-weight="bold">Placement Reference:</text>
  <text x="420" y="350" font-family="Arial" font-size="9">See firmware LRA_PINS</text>
  <text x="420" y="365" font-family="Arial" font-size="9">Mapping</text>
</svg>