<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="300" fill="white"/>
  
  <!-- Title -->
  <text x="200" y="25" text-anchor="middle" font-family="Arial" font-size="14" font-weight="black">LRA Pocket Sewing Diagram</text>
  
  <!-- Pocket pieces -->
  <!-- Shell pieces (two layers) -->
  <rect x="50" y="50" width="100" height="100" fill="lightgray" stroke="gray" stroke-width="1"/>
  <!-- Inner shell (with stabilizer) -->
  <rect x="52" y="52" width="96" height="96" fill="whitesmoke" stroke="darkgray" stroke-width="1" stroke-dasharray="2,2"/>
  <!-- Stabilizer strip (inside inner shell, bottom) -->
  <rect x="52" y="138" width="96" height="4" fill="darkgray"/>
  
  <!-- Flap piece -->
  <rect x="50" y="160" width="120" height="65" fill="lightgray" stroke="gray" stroke-width="1"/>
  
  <!-- Velcro pieces -->
  <!-- Hook Velcro on flap underside -->
  <rect x="100" y="160" width="24" height="24" fill="orange" stroke="orange" stroke-width="1"/>
  <text x="112" y="175" text-anchor="middle" font-family="Arial" font-size="8" fill="white">HOOK</text>
  <!-- Loop Velcro on pocket rim -->
  <rect x="90" y="140" width="24" height="24" fill="lightblue" stroke="blue" stroke-width="1"/>
  <text x="102" y="155" text-anchor="middle" font-family="Arial" font-size="8" fill="white">LOOP</text>
  
  <!-- Dimensions -->
  <!-- Shell cut size -->
  <line x1="50" y1="40" x2="150" y2="40" stroke="black" stroke-width="1"/>
  <line x1="50" y1="35" x2="50" y2="45" stroke="black" stroke-width="1"/>
  <line x1="150" y1="35" x2="150" y2="45" stroke="black" stroke-width="1"/>
  <text x="100" y="30" text-anchor="middle" font-family="Arial" font-size="10">14mm</text>
  
  <line x1="40" y1="50" x2="40" y2="150" stroke="black" stroke-width="1"/>
  <line x1="35" y1="50" x2="45" y2="50" stroke="black" stroke-width="1"/>
  <line x1="35" y1="150" x2="45" y2="150" stroke="black" stroke-width="1"/>
  <text x="30" y="100" text-anchor="end" font-family="Arial" font-size="10" transform="rotate(-90 30,100)">14mm</text>
  
  <!-- Internal size (10mm) -->
  <line x1="60" y1="60" x2="140" y2="60" stroke="red" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="60" y1="55" x2="60" y2="65" stroke="red" stroke-width="1"/>
  <line x1="140" y1="55" x2="140" y2="65" stroke="red" stroke-width="1"/>
  <text x="100" y="50" text-anchor="middle" font-family="Arial" font-size="9" fill="red">10mm</text>
  
  <line x1="50" y1="60" x2="50" y2="140" stroke="red" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="45" y1="60" x2="55" y2="60" stroke="red" stroke-width="1"/>
  <line x1="45" y1="140" x2="55" y2="140" stroke="red" stroke-width="1"/>
  <text x="40" y="100" text-anchor="end" font-family="Arial" font-size="9" fill="red" transform="rotate(-90 40,100)">10mm</text>
  
  <!-- Seam allowance (2mm) -->
  <line x1="50" y1="40" x2="60" y2="40" stroke="green" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="55" y="35" text-anchor="middle" font-family="Arial" font-size="8" fill="green">2mm</text>
  
  <line x1="140" y1="40" x2="150" y2="40" stroke="green" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="145" y="35" text-anchor="middle" font-family="Arial" font-size="8" fill="green">2mm</text>
  
  <!-- Flap dimensions -->
  <line x1="50" y1="150" x2="170" y2="150" stroke="black" stroke-width="1"/>
  <line x1="50" y1="145" x2="50" y2="155" stroke="black" stroke-width="1"/>
  <line x1="170" y1="145" x2="170" y2="155" stroke="black" stroke-width="1"/>
  <text x="110" y="140" text-anchor="middle" font-family="Arial" font-size="10">18mm</text>
  
  <line x1="50" y1="160" x2="50" y2="225" stroke="black" stroke-width="1"/>
  <line x1="45" y1="160" x2="55" y2="160" stroke="black" stroke-width="1"/>
  <line x1="45" y1="225" x2="55" y2="225" stroke="black" stroke-width="1"/>
  <text x="40" y="192" text-anchor="end" font-family="Arial" font-size="10" transform="rotate(-90 40,192)">65mm</text>
  
  <!-- Velcro size -->
  <line x1="100" y1="155" x2="124" y2="155" stroke="purple" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="112" y="150" text-anchor="middle" font-family="Arial" font-size="8" fill="purple">12mm</text>
  
  <line x1="90" y1="140" x2="90" y2="164" stroke="purple" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="85" y="152" text-anchor="end" font-family="Arial" font-size="8" fill="purple" transform="rotate(-90 85,152)">12mm</text>
  
  <!-- Stitching lines -->
  <!-- Shell sewing (three sides) -->
  <line x1="50" y1="50" x2="150" y2="50" stroke="black" stroke-width="1.5"/>
  <line x1="150" y1="50" x2="150" y2="150" stroke="black" stroke-width="1.5"/>
  <line x1="50" y1="150" x2="150" y2="150" stroke="black" stroke-width="1.5"/>
  
  <!-- Flap attachment (top edge) -->
  <line x1="50" y1="160" x2="170" y2="160" stroke="black" stroke-width="1.5"/>
  
  <!-- Notes -->
  <rect x="220" y="50" width="160" height="200" fill="whitesmoke" stroke="black" stroke-width="1"/>
  <text x="300" y="70" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">Key Points</text>
  <text x="230" y="90" font-family="Arial" font-size="10">• Internal pocket: 10mm × 10mm</text>
  <text x="230" y="105" font-family="Arial" font-size="10">• Flap overlap: ≥5mm when closed</text>
  <text x="230" y="120" font-family="Arial" font-size="10">• Stabilizer: optional inside seam</text>
  <text x="230" y="135" font-family="Arial" font-size="10">• Velcro: hook on flap, loop on rim</text>
  <text x="230" y="150" font-family="Arial" font-size="10">• Seam allowance: 2mm on all edges</text>
  <text x="230" y="165" font-family="Arial" font-size="10">• Leave one side open for insertion</text>
  <text x="230" y="180" font-family="Arial" font-size="10">• Turn right-side out after sewing</text>
  <text x="230" y="195" font-family="Arial" font-size="10">• Top-stitch open edge (optional)</text>
  <text x="230" y="210" font-family="Arial" font-size="10">• Wire exit: leave gap in seam</text>
  
  <!-- Arrow showing turn -->
  <path d="M180,100 Q200,80 220,100" stroke="black" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="200" y="70" text-anchor="middle" font-family="Arial" font-size="10">Turn right-side out</text>
  
  <!-- Defs for arrowhead -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="black"/>
    </marker>
  </defs>
</svg>